openapi: 3.0.3
info:
  title: Araba Skor 360 API
  description: >
    Önceden hesaplanmış araç skorlarını sunar; kullanıcıların araçlara 1-100 arası
    skor ve serbest metin yorum girmesine izin verir. Korumalı uçlar,
    user-platform-service tarafından doğrulanan bir Firebase ID token
    (`Authorization: Bearer <token>`) bekler.
  version: "0.1.0"
servers:
  - url: http://localhost:7070
tags:
  - name: Cars
  - name: Cost of Ownership
  - name: Reviews
paths:
  /health:
    get:
      summary: Sağlık kontrolü
      operationId: health
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/cars:
    get:
      tags: [Cars]
      summary: Araçları listele
      operationId: listCars
      parameters:
        - $ref: "#/components/parameters/Lang"
        - name: q
          in: query
          description: Marka/model üzerinde serbest metin arama (substring, marka+model ile birlikte kullanılabilir)
          schema:
            type: string
        - name: make
          in: query
          description: >
            Tam marka eşleşmesi (case-insensitive, q'nun aksine substring değil) — virgülle
            birden fazla marka verilebilir (ör. "Renault,BMW"). q ile birlikte kullanılırsa
            ikisi AND'lenir (ör. make=Renault&q=clio → sadece Renault Clio'lar).
          schema:
            type: string
        - name: minYear
          in: query
          description: >
            Jenerasyonun [yearStart, yearEnd] aralığı bu değerle KESİŞİYORSA eşleşir
            (yearEnd >= minYear) — sadece minYear'da başlayanlar değil. maxYear ile
            birlikte verilirse ikisi bir aralık kesişimi oluşturur.
          schema:
            type: integer
        - name: maxYear
          in: query
          description: Jenerasyonun yearStart <= maxYear olmasını ister — bkz. minYear açıklaması
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: sortBy
          in: query
          description: >
            Verilmezse marka+model'e göre alfabetik sıralanır (varsayılan, DB seviyesinde
            ucuz). Verilirse tüm eşleşen satırlar önce çekilip bellekte sıralanır (katalog
            şu an birkaç yüz satır olduğu için sorun değil) — puanı/veri noktası olmayan
            araçlar her zaman en sona düşer (ne artan ne azalanda "en iyi" ya da "en kötü"
            sayılmazlar). costOfOwnership burada YOK — liste uç noktasında hiç
            hesaplanmıyor (bkz. Car şemasındaki costOfOwnership açıklaması), o yüzden ona
            göre sıralama sunulmuyor.
          schema:
            type: string
            enum: [score, ncapStars, communityScore, fuelConsumption]
        - name: order
          in: query
          description: >
            Verilmezse her sortBy kendi "en iyi önce" yönünü kullanır: score/ncapStars/
            communityScore için azalan (yüksek=iyi), fuelConsumption için artan (düşük
            L/100km=iyi). "asc" ya da "desc" ile bu varsayılan ezilebilir.
          schema:
            type: string
            enum: [asc, desc]
      responses:
        "200":
          description: Araç listesi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Car"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/cars/{id}:
    get:
      tags: [Cars]
      summary: Araç detayı
      operationId: getCar
      parameters:
        - $ref: "#/components/parameters/CarId"
        - $ref: "#/components/parameters/Lang"
      responses:
        "200":
          description: Araç
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Car"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/cars/{id}/cost-of-ownership:
    get:
      tags: [Cost of Ownership]
      summary: Yıllık yürütme maliyeti (MTV + yakıt) — 0-100 skordan tamamen ayrı bir eksen
      description: >
        `score`'un aksine önceden hesaplanmış tek bir sayı değil: MTV ve yakıt maliyeti
        aracın gerçek tescil yılına ve yıllık km'sine bağlı olarak canlı hesaplanır. Bir
        model_variant genelde birden çok motor/yakıt seçeneği (VCA trim'i) içerdiğinden
        `options` bir liste döner — gruplama `(fuelType, testingScheme, engineCc)` üçlüsüne
        göre yapılır, yani her GERÇEK motor kendi satırında görünür (aynı yakıt tipinde
        farklı hacimli iki motoru — ör. 1197cc ve 1618cc — tek bir fiktif "ortalama motor"a
        indirgemez; bu, MTV'yi yanlış vergi dilimine düşürüp gerçek olmayan bir tutar
        gösterebiliyordu, canlı DB'de doğrulanıp düzeltildi). NEDC ve WLTP test
        metodolojisine ait satırlar asla birbirine karıştırılmaz, her option kendi
        `testingScheme`'ini taşır. `mtv`/`fuel` alanları veri eşleşmezse (örn. elektrikli
        araçlar, henüz kW bazlı MTV tarifesi transcribe edilmedi) `null` döner — sessizce
        yanlış bir sayı üretmek yerine
        `notes` içinde açıklanır.
      operationId: getCostOfOwnership
      parameters:
        - $ref: "#/components/parameters/CarId"
        - $ref: "#/components/parameters/Lang"
        - name: registrationYear
          in: query
          description: Aracın gerçek tescil yılı. Verilmezse model_variant.yearStart kullanılır (yaklaşık değer).
          schema:
            type: integer
        - name: annualKm
          in: query
          description: Yıllık ortalama km. Verilmezse 15000.
          schema:
            type: integer
            default: 15000
        - name: trValueTl
          in: query
          description: >
            2018+ araçlar için MTV "taşıt değeri" bandı (TL). Verilmezse en üst değer bandı
            varsayılır — 2018 öncesi (tarife I/A) araçlarda bu parametrenin etkisi yoktur.
          schema:
            type: number
      responses:
        "200":
          description: Yıllık yürütme maliyeti seçenekleri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostOfOwnership"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/cars/{id}/reviews:
    get:
      tags: [Reviews]
      summary: Araca ait kullanıcı skor/yorumlarını listele
      operationId: listReviews
      parameters:
        - $ref: "#/components/parameters/CarId"
        - $ref: "#/components/parameters/Lang"
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: Review listesi (en yeni önce)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Reviews]
      summary: Skor + yorum gönder ya da güncelle (upsert)
      description: >
        Kullanıcı başına araç başına tek kayıt tutulur; aynı kullanıcı tekrar
        gönderirse mevcut kaydı günceller. `score` (genel memnuniyet) tek zorunlu alan;
        interiorQualityScore/powertrainHarmonyScore/nvhScore/rideComfortScore opsiyonel
        detay kategorileri — kullanıcı doldurmak istemezse boş bırakılabilir.
        user-platform-service üzerindeki `daily_reviews` kullanım kotasını tüketir
        (limit aşılırsa 429 döner).
      operationId: upsertReview
      security:
        - firebaseAuth: []
      parameters:
        - $ref: "#/components/parameters/CarId"
        - $ref: "#/components/parameters/Lang"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
      responses:
        "200":
          description: Kaydedilen review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Günlük kota aşıldı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/cars/{id}/reviews/me:
    get:
      tags: [Reviews]
      summary: Giriş yapmış kullanıcının bu araca ait review'ı
      operationId: getMyReview
      security:
        - firebaseAuth: []
      parameters:
        - $ref: "#/components/parameters/CarId"
        - $ref: "#/components/parameters/Lang"
      responses:
        "200":
          description: Review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Reviews]
      summary: Giriş yapmış kullanıcının review'ını sil
      operationId: deleteMyReview
      security:
        - firebaseAuth: []
      parameters:
        - $ref: "#/components/parameters/CarId"
        - $ref: "#/components/parameters/Lang"
      responses:
        "204":
          description: Silindi
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    firebaseAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase ID token (client-side login sonrası alınır, user-platform-service üzerinden doğrulanır).

  parameters:
    CarId:
      name: id
      in: path
      required: true
      description: model_variant.id
      schema:
        type: integer
    Lang:
      name: lang
      in: query
      description: >
        Yanıttaki kullanıcıya açık metinlerin (notes, hata mesajları) dili. "en" dışında
        her şey (boş dahil) Türkçe döner — varsayılan bu uygulamanın ana pazarı olduğu
        için Türkçe'dir. Sayısal/tarih alanlarını, ya da TSB gibi dış kaynakların kendi
        (her zaman Türkçe) metinlerini etkilemez.
      schema:
        type: string
        enum: [tr, en]
        default: tr

  responses:
    NotFound:
      description: Bulunamadı
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Geçersiz istek
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Eksik/geçersiz Authorization header
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string

    Car:
      type: object
      properties:
        id:
          type: integer
        make:
          type: string
        model:
          type: string
        generation:
          type: string
          nullable: true
        yearStart:
          type: integer
        yearEnd:
          type: integer
        trName:
          type: string
          nullable: true
        score:
          type: number
          format: double
          nullable: true
          description: Önceden hesaplanmış model skoru (model_variant_score.score)
        confidence:
          type: string
          nullable: true
          description: >
            `?lang`'a göre çevrilir (ör. `lang=tr` için "Yüksek"/"Orta"/"Düşük", `lang=en`
            için "High"/"Medium"/"Low") — sabit bir enum değeri olarak parse etmeyin.
        sampleSize:
          type: integer
          nullable: true
        nhtsaCovered:
          type: boolean
          nullable: true
        recallCount:
          type: integer
          nullable: true
        communityScore:
          type: number
          format: double
          nullable: true
          description: Kullanıcı review'larının ortalaması (1-100)
        communityReviewCount:
          type: integer
        communityCategoryScores:
          $ref: "#/components/schemas/CommunityCategoryScores"
          description: >
            Review'lardaki opsiyonel detay kategorilerinin (bkz. ReviewRequest) topluluk
            ortalamaları. Her kategori kendi count'unu taşır çünkü kategoriler opsiyonel —
            communityReviewCount ile aynı örneklem büyüklüğüne dayandığı varsayılmamalı.
        bestFuelConsumptionL100km:
          type: number
          nullable: true
          description: >
            Bu jenerasyonun sunduğu motorlar arasında en düşük (en verimli) kombine
            L/100km değeri (vca_fuel_consumption'dan MIN) — farklı motorların ortalaması
            DEĞİL, sadece en iyi gerçek motor. Elektrikli-only jenerasyonlarda veya VCA
            verisi hiç yoksa null.
        ncapRating:
          $ref: "#/components/schemas/NcapRating"
          nullable: true
          description: Önceden hesaplanmış (elle araştırılmış) Euro NCAP puanı — hem listede hem detayda dolu
        costOfOwnership:
          $ref: "#/components/schemas/CostOfOwnership"
          nullable: true
          description: >
            Sadece GET /api/cars/{id} (tekil detay) cevabında dolu — GET /api/cars listesinde
            her satır için ekstra DB sorgusu yapmamak adına burada her zaman null'dır.
            Varsayılan parametrelerle (registrationYear=yearStart, annualKm=15000) hesaplanır;
            gerçek bir alıcının aracına göre özelleştirmek için doğrudan
            GET /api/cars/{id}/cost-of-ownership kullanılmalı.

    CommunityCategoryScores:
      type: object
      properties:
        interiorQualityScore:
          type: number
          nullable: true
        interiorQualityCount:
          type: integer
        powertrainHarmonyScore:
          type: number
          nullable: true
        powertrainHarmonyCount:
          type: integer
        nvhScore:
          type: number
          nullable: true
        nvhCount:
          type: integer
        rideComfortScore:
          type: number
          nullable: true
        rideComfortCount:
          type: integer

    NcapRating:
      type: object
      properties:
        stars:
          type: number
          description: 0-5 arası Euro NCAP yıldız derecesi
        adultOccupantPct:
          type: number
          nullable: true
          description: Yetişkin yolcu koruması (%) — bazı eski testlerde kaynak doğrulanamadığı için null olabilir
        childOccupantPct:
          type: number
          nullable: true
        vruPct:
          type: number
          nullable: true
          description: "Vulnerable Road User (yaya/bisikletli) koruması (%)"
        safetyAssistPct:
          type: number
          nullable: true
        testYear:
          type: integer
        source:
          type: string
          description: Kaynak/doğrulama notu (elle araştırılmış veri, kaynağı izlenebilir tutmak için)
        notes:
          type: string
          nullable: true

    CostOfOwnership:
      type: object
      properties:
        modelVariantId:
          type: integer
        registrationYear:
          type: integer
        ageYears:
          type: integer
        asOfYear:
          type: integer
        annualKm:
          type: integer
        options:
          type: array
          items:
            $ref: "#/components/schemas/CostOption"
        kaskoDegerOptions:
          type: array
          items:
            $ref: "#/components/schemas/KaskoDegerOption"
          description: >
            TSB'nin (Türkiye Sigorta Birliği) resmi aylık kasko değer listesinden, bu araç +
            tescil yılına uyan trim'lerin GERÇEK değerleri (tahmin değil). Boş, tek, ya da
            birden çok satır dönebilir — bir nesil birden fazla trim içerir, bu yüzden
            tekil bir sayıya indirgenmez. trValueTl verilmezse estimatedKaskoAnnualTl bu
            listenin ortalamasını kullanır (MTV değer bandı hesabına hâlâ bağlı değil).
        valueHistory:
          type: array
          items:
            $ref: "#/components/schemas/ValueHistoryTrend"
          description: >
            kaskoDegerOptions'daki her bir trim için, o SABİT model yılının TSB değerinin
            takvim zamanı içinde (her ingest edilmiş snapshot_month'ta) nasıl değiştiğini
            gösteren longitudinal seri — marka, trim VE model yılı sabit tutulup sadece
            snapshot_month değişir, ek veri kaynağı gerektirmez. Eşleşen trim için TSB'de tek
            snapshot varsa hiç dönmez. Nominal TL değerler enflasyondan arındırılmamıştır — TL
            devalüasyonu genelde aracın gerçek yaşlanma kaybından daha büyük olduğu için
            valueTl serisi sıklıkla ARTAN değerler gösterir, bu gerçek (reel) değer kazancı
            anlamına gelmez. Bunun için her noktada ayrıca TCMB USD kuruyla hesaplanmış
            valueUsd de var — asıl "gerçekten değer kazandı mı kaybetti mi" sorusuna cevap
            veren `usdChangePct`/`usdChangePerYearPct` bu değerlere dayanır.
        estimatedKaskoAnnualTl:
          $ref: "#/components/schemas/EstimateRange"
          nullable: true
          description: >
            Gerçek bir teklif DEĞİL — araç değerinin %2-5'i arası kaba bir aralık. Araç değeri
            önce trValueTl query param'ından, o verilmezse kaskoDegerOptions'ın ortalamasından
            alınır; ikisi de yoksa (ne trValueTl ne TSB eşleşmesi) null döner.
        estimatedTrafficInsuranceAnnualTl:
          $ref: "#/components/schemas/EstimateRange"
          description: >
            Gerçek bir teklif DEĞİL — bu araca özel değil, genel/jenerik bir aralık (hasar
            basamağı, il, araç sınıfına göre gerçek fiyat bunun dışına da çıkabilir).
        notes:
          type: array
          items:
            type: string
          description: Veri eksikliği/varsayım gibi durumlarda kullanıcıya gösterilecek açıklamalar

    EstimateRange:
      type: object
      properties:
        minTl:
          type: number
        maxTl:
          type: number

    KaskoDegerOption:
      type: object
      properties:
        tipKodu:
          type: integer
          description: >
            TSB'nin bu trim'e verdiği dahili tip kodu — sadece bilgi amaçlı gösterilir, eşleştirme
            için KULLANILMAZ (bu kod TSB tarafından her model_year listesinde bağımsızca yeniden
            kullanılıyor, aynı trim'i yıllar arasında takip etmek için güvenilir değil)
        make:
          type: string
          description: "TSB'nin kendi marka string'i (ör. \"TOFAS-FIAT\"), bizim `make` alanımızla birebir aynı olmayabilir"
        trim:
          type: string
          description: "TSB'nin trim açıklaması, ör. \"EGEA SEDAN URBAN PLUS 1.6 M.JET 120\""
        modelYear:
          type: integer
        valueTl:
          type: number
        snapshotMonth:
          type: string
          format: date
          description: Bu değerin ait olduğu TSB anlık görüntüsünün ayı (o ayın ilk günü)
        source:
          type: string

    ValueHistoryPoint:
      type: object
      properties:
        year:
          type: integer
          description: TSB anlık görüntüsünün takvim yılı (araç modelYear'ı değil)
        valueTl:
          type: number
          description: O yılki anlık görüntüde bu SABİT model yılının nominal TL değeri
        valueUsd:
          type: number
          nullable: true
          description: >
            valueTl / o günün TCMB USD döviz alış kuru (exchange_rate tablosu). TRY'nin kendi
            devalüasyonundan arındırılmış, daha gerçekçi değer sinyali. O tarih için kur verisi
            yoksa null.

    ValueHistoryTrend:
      type: object
      properties:
        make:
          type: string
        trim:
          type: string
        modelYear:
          type: integer
          description: Sabit tutulan araç model yılı — points dizisindeki her nokta bu aynı model yılının farklı yıllardaki değeridir
        points:
          type: array
          items:
            $ref: "#/components/schemas/ValueHistoryPoint"
          description: year'a göre artan sırada, TSB'nin bu trim + model yılı için ingest edilmiş her anlık görüntüsü
        nominalChangePct:
          type: number
          nullable: true
          description: >
            En eski ile en yeni snapshot arasındaki nominal TL değişim yüzdesi (pozitif = nominal
            artış — bkz. valueHistory alan açıklamasındaki enflasyon notu). Tek snapshot varsa null.
        nominalChangePerYearPct:
          type: number
          nullable: true
          description: nominalChangePct'nin yıl başına ortalaması
        usdChangePct:
          type: number
          nullable: true
          description: >
            En eski ile en yeni snapshot arasındaki USD-bazlı değişim yüzdesi — asıl "gerçekten
            değer kazandı mı kaybetti mi" sorusunun cevabı (negatif = gerçek değer kaybı). Seri
            içindeki herhangi bir noktada valueUsd yoksa (kur verisi eksikse) null.
        usdChangePerYearPct:
          type: number
          nullable: true
          description: usdChangePct'nin yıl başına ortalaması

    CostOption:
      type: object
      properties:
        fuelType:
          type: string
          description: "VCA'daki ham yakıt tipi, ör. Petrol, Diesel, 'Petrol / LPG', Electricity"
        testingScheme:
          type: string
          enum: [NEDC, WLTP]
          description: NEDC ve WLTP karşılaştırılabilir değildir, bu yüzden asla harmanlanmaz
        engineCc:
          type: integer
          nullable: true
        literPer100km:
          type: number
          nullable: true
        fuel:
          $ref: "#/components/schemas/FuelCostInfo"
          nullable: true
        mtv:
          $ref: "#/components/schemas/MtvInfo"
          nullable: true
        totalAnnualTl:
          type: number
          nullable: true
          description: mtv.annualTl + fuel.annualCostTl (ikisi de doluysa) — sadece GERÇEK MTV+yakıt, sigorta dahil değil
        totalWithInsuranceAnnualTl:
          $ref: "#/components/schemas/EstimateRange"
          nullable: true
          description: >
            totalAnnualTl + estimatedKaskoAnnualTl + estimatedTrafficInsuranceAnnualTl — bu
            motorla aracı bir yıl sahiplenmenin (vergi+yakıt+kasko+trafik sigortası) toplam
            maliyeti, aralık olarak (kasko/trafik tahmini olduğu için). totalAnnualTl ya da
            estimatedKaskoAnnualTl'den biri eksikse (ör. TSB eşleşmesi yoksa) null döner —
            eksik bir gerçek maliyet kalemini sessizce atlayıp yanıltıcı bir toplam gösterilmez.
        note:
          type: string
          nullable: true

    FuelCostInfo:
      type: object
      properties:
        pricePerLiterTl:
          type: number
        observedAt:
          type: string
          format: date
        annualCostTl:
          type: number

    MtvInfo:
      type: object
      properties:
        tarife:
          type: string
          enum: ["I", "I/A"]
        ageBracket:
