        interiorQualityScore:
          type: integer
          minimum: 1
          maximum: 100
          nullable: true
          description: İç mekân kalitesi (malzeme, işçilik)
        powertrainHarmonyScore:
          type: integer
          minimum: 1
          maximum: 100
          nullable: true
          description: Motor-şanzıman uyumu
        nvhScore:
          type: integer
          minimum: 1
          maximum: 100
          nullable: true
          description: Ses yalıtımı (rüzgar/yol/motor sesi tek eksende — NVH)
        rideComfortScore:
          type: integer
          minimum: 1
          maximum: 100
          nullable: true
          description: Sürüş konforu (süspansiyon, yol tutuş hissi)
        comment:
          type: string
          nullable: true

    Review:
